<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hunterston Recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,500;6..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: FatCat9 — a calm guide for people who have not read the report.
   IDEA: a map of six territories around one shared direction; each territory is a short guided route of five questions.
   PICTURE: an interactive ring map on the overview; a drawn scene for each territory.
   COLOUR and TYPE: FatCat9 brand — navy #15233A, paper #F6F4F1, pink #F43098; Google Sans Flex.
   LAYOUT: top nav; full-bleed navy hero with map; territory pages = hero scene, 30-second summary, one step at a time. */
:root{color-scheme:light dark;
--bg:light-dark(#F6F4F1,#0E1828);--surface:light-dark(#FFFFFF,#16233A);--surface2:light-dark(#EDE9E3,#1A2943);
--ink:light-dark(#15233A,#EEF0F4);--muted:light-dark(#5C5B63,#B4BAC6);--meta:light-dark(#8A8A93,#8C94A3);--line:light-dark(#E0DBD4,#2A3A56);
--navy:#15233A;--navy2:#1F3050;--navy3:#2A3E63;--pink:#F43098;--pinkInk:light-dark(#C21874,#FF6BB5);--blush:light-dark(#FCE4F0,#3A2240);--on:#F5F5F7;--on2:#C4C4CC}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Google Sans Flex","Inter",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,18px)}
h1{font-size:clamp(34px,4vw,52px);line-height:1.03;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:19px;line-height:1.3;margin:0}
p{margin:0}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.pk{color:var(--pink)}
.eyebrow{font-size:14px;font-weight:500;color:var(--pinkInk);margin-bottom:14px}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--navy);color:var(--on)}
header .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
header img{height:22px;display:block}
.tnav{display:flex;gap:2px;margin-left:8px;overflow-x:auto}
.tnav a{display:flex;gap:7px;align-items:center;text-decoration:none;color:var(--on2);font-size:14px;padding:9px 10px;border-radius:10px;white-space:nowrap}
.tnav a svg.i{width:16px;height:16px}
.tnav a:hover{color:#fff;background:var(--navy2)}.tnav a[aria-current]{color:#fff;background:var(--navy2)}.tnav a[aria-current] svg{color:var(--pink)}
.sbtn{margin-left:auto;display:flex;gap:8px;align-items:center;border:0;background:var(--navy2);color:var(--on2);border-radius:999px;padding:0 16px;min-height:42px;font-size:15px}
.sbtn:hover{color:#fff}

/* overview */
.hero,.thero{position:relative}
.hero .wrap,.thero .wrap{position:relative;z-index:1}
.hero,.thero{position:relative}
.hero::before,.thero::before{content:"";position:absolute;top:22px;right:max(2vw,16px);width:260px;height:273px;background:url(cat.png) no-repeat center/contain;opacity:.1;pointer-events:none}
.thero::before{top:22px}
.hero .wrap,.thero .wrap{position:relative;z-index:1}
@media(max-width:900px){.hero::before,.thero::before{width:150px;height:157px;top:16px;right:16px;opacity:.07}}
.hero{background:var(--navy);color:var(--on);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:40px;align-items:start;padding-top:clamp(24px,2.6vw,36px);padding-bottom:clamp(36px,4vw,56px)}
.hero .eyebrow{color:var(--pink)}
.hero .wrap>div:first-child{padding-top:clamp(4px,2vw,28px)}
.hero .lede{color:var(--on2);margin-top:18px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;gap:10px;align-items:center;border-radius:12px;padding:0 20px;min-height:50px;font-weight:700;text-decoration:none;border:0}
.btn.pink{background:var(--pink);color:#fff}.btn.ghost{background:transparent;color:var(--on);border:1px solid var(--navy3)}
.btn.ghost:hover{border-color:var(--pink)}
.mapbox{position:relative}
.map{width:100%;height:auto;display:block;max-width:440px;margin:0 auto}
.map .node{cursor:pointer}
.map .node circle.b{fill:var(--navy2);stroke:var(--navy3);stroke-width:1.5;transition:fill .2s,stroke .2s}
.map .node:hover circle.b,.map .node.on circle.b,.map .node:focus circle.b{fill:var(--pink);stroke:var(--pink)}
.map .node text{fill:var(--on);font:500 13px "Google Sans Flex",sans-serif}
.map .node .num{fill:var(--pink);font-weight:700}
.map .node:hover .num,.map .node.on .num{fill:#fff}
.map line{stroke:var(--navy3);stroke-width:1.5;stroke-dasharray:3 5;transition:stroke .2s}
.map line.on{stroke:var(--pink);stroke-dasharray:none}
.map .core{fill:var(--on)}
.peek{margin-top:6px;min-height:110px;background:var(--navy2);border-radius:16px;padding:16px 18px}
.peek small{color:var(--pink);font-size:13px}
.peek b{display:block;font-size:18px;margin:2px 0 4px}
.peek span{color:var(--on2);font-size:14.5px}
.legend{padding:clamp(48px,5vw,72px) 0 clamp(40px,4vw,56px)}
.qs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:26px;border-top:1px solid var(--line)}
.q{padding:20px 18px 0 0;position:relative}
.q .n{font-size:13px;color:var(--meta)}
.q .ic{width:46px;height:46px;border-radius:14px;background:var(--blush);color:var(--pinkInk);display:grid;place-items:center;margin:12px 0}
.q b{display:block;font-size:17px}.q span{color:var(--muted);font-size:15px}
.q:not(:last-child)::after{content:"";position:absolute;right:10px;top:46px;width:18px;height:2px;background:var(--line)}
.tlist{padding:0 0 clamp(48px,6vw,88px)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px}
.tcard{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border-radius:22px;overflow:hidden;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(21,35,58,.14)}
.tcard .art{background:var(--navy);aspect-ratio:16/9}
.tcard .art svg{width:100%;height:100%;display:block}
.tcard .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.tcard small{color:var(--pinkInk);font-weight:500;font-size:13.5px}
.tcard h3{font-size:20px}
.tcard p{color:var(--muted);font-size:15px}
.tcard .go{margin-top:auto;padding-top:10px;display:flex;gap:6px;align-items:center;font-weight:700;color:var(--pinkInk);font-size:15px}

/* territory */
.thero{background:var(--navy);color:var(--on);overflow:hidden}
.thero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px 40px;align-items:start;padding-top:24px;padding-bottom:48px}
.crumbs{grid-column:1/-1;display:flex;gap:8px;font-size:14px;color:var(--on2);flex-wrap:wrap}.crumbs a{text-decoration:none}.crumbs a:hover{color:#fff}
.thero .eyebrow{color:var(--pink);display:flex;gap:10px;align-items:center;margin:0 0 14px}
.thero h1{font-size:clamp(30px,4vw,48px)}
.thero .lede{color:var(--on2);margin-top:16px;font-size:17px}
.thero .art{align-self:center}.thero .art svg{width:100%;height:auto;display:block}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px}
.stat b{display:block;font-size:clamp(30px,3.6vw,44px);line-height:1;color:var(--pink)}
.stat span{font-size:13.5px;color:var(--on2)}
.sig{font-size:13px;color:#8C94A3;margin-top:22px}
.quick{padding:clamp(36px,4vw,56px) 0 8px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:20px}
.qgrid div{border-top:2px solid var(--ink);padding-top:16px}
.qgrid small{display:block;font-size:13.5px;color:var(--pinkInk);font-weight:500;margin-bottom:8px}
.qgrid b{display:block;font-size:20px;line-height:1.3;margin-bottom:8px}
.qgrid span{color:var(--muted)}
.stepper{position:sticky;top:68px;z-index:20;background:var(--bg);margin-top:40px;border-bottom:1px solid var(--line)}
.stepper .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stepper a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:14px 6px 12px;border-bottom:3px solid transparent;color:var(--muted)}
.stepper a .c{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted)}
.stepper a span{display:flex;flex-direction:column;line-height:1.2;font-size:14.5px;font-weight:500}
.stepper a span em{font-style:normal;font-size:12.5px;color:var(--meta);font-weight:400}
.stepper a[aria-current]{color:var(--ink);border-bottom-color:var(--pink)}
.stepper a[aria-current] .c{background:var(--pink);color:#fff}
.stepper a.done .c{background:var(--navy);color:#fff}
.stage{padding:36px 0 56px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage h2{font-size:clamp(24px,2.8vw,34px)}
.stage>.wrap>.lede{margin-top:10px;margin-bottom:30px;font-size:17px}
.qhead{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--pinkInk);font-weight:500;margin-bottom:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1.1fr)}
.pane{background:var(--surface);border-radius:22px;padding:28px}
.pane.dark{background:var(--navy);color:var(--on)}
.plab{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;color:var(--pinkInk);margin-bottom:14px}
.dark .plab{color:var(--pink)}
.ib{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--blush);color:var(--pinkInk)}
.ib svg.i{width:18px;height:18px}.ib.solid{background:var(--pink);color:#fff}
.plead{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:14px}
ul.b{margin:0;padding-left:18px}ul.b li{margin:9px 0;color:var(--muted)}ul.b li::marker{color:var(--pink)}
.dark ul.b li{color:var(--on2)}
.mid{display:grid;place-items:center;align-content:center;gap:6px;font-size:13px;color:var(--pinkInk)}
.dot{width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
.keyline{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
.keyline .pane{display:flex;gap:14px}
.keyline .k{font-weight:700;font-size:18px;line-height:1.45;margin-top:4px}
.ev{font-size:14.5px;line-height:1.8;margin-top:4px}.ev a{color:var(--pinkInk);font-weight:500}
.rule{display:flex;gap:16px;align-items:flex-start;background:var(--navy);color:var(--on);border-radius:20px;padding:22px 26px;margin-bottom:22px}
.rule.soft{background:var(--surface2);color:var(--ink)}
.rule small{display:block;color:var(--pink);font-size:13.5px;font-weight:500;margin-bottom:2px}
.rule.soft small{color:var(--pinkInk)}
.rule p{font-size:17px}
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.25fr);gap:20px;padding:22px 0;border-top:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:1px solid var(--line)}
.row .n{font-size:28px;font-weight:700;color:var(--pink);line-height:1}
.row h3{font-size:18px;margin-bottom:6px}
.row .why{color:var(--meta);font-size:15px}
.row .what{font-size:16px}
.row .what small{display:block;font-size:13px;color:var(--pinkInk);font-weight:500;margin-bottom:4px}
.role{display:inline-block;background:var(--blush);color:var(--pinkInk);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.risks{display:grid;gap:12px}
.risk{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border-radius:18px;padding:20px 22px}
.risk .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:light-dark(#FFF1E0,#3A2D18);color:light-dark(#A45A00,#FFB561)}
.risk h3{font-size:17px}.risk .if{font-style:italic;color:var(--muted);font-size:15px;margin-top:4px}
.risk .do{display:flex;gap:10px;font-weight:700;font-size:15.5px}
.risk .do svg{color:var(--pink);margin-top:2px}
.seq{list-style:none;margin:0;padding:0}
.seq li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:16px;padding-bottom:24px;position:relative}
.seq li:not(:last-child)::before{content:"";position:absolute;left:22px;top:46px;bottom:0;width:2px;background:var(--line)}
.seq .c{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.seq li:first-child .c{background:var(--pink)}
.seq b{display:block;font-size:17px}.seq span{color:var(--muted)}
.checks{list-style:none;margin:0;padding:0}.checks li{display:flex;gap:12px;padding:13px 0;border-top:1px solid #2E3E5A}
.checks svg{color:var(--pink)}
.next{display:flex;justify-content:space-between;gap:14px;margin-top:36px;flex-wrap:wrap}
.next a{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:16px 20px;border-radius:16px;background:var(--surface);min-width:240px;flex:1;max-width:420px;border:1px solid var(--line)}
.next a:hover{border-color:var(--pink)}
.next a.fwd{margin-left:auto;text-align:right;background:var(--navy);color:var(--on);border-color:var(--navy)}
.next a small{color:var(--meta);font-size:13px}.next a.fwd small{color:var(--pink)}
.next a b{font-size:17px}
.switch{background:var(--surface2);padding:36px 0}
.switch .row6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}
.switch a{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--surface);border-radius:16px;padding:14px;font-size:14px;border:2px solid transparent}
.switch a:hover{border-color:var(--pink)}.switch a[aria-current]{border-color:var(--navy)}
.switch a small{color:var(--meta)}

/* search overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(14,24,40,.6);display:none;padding:min(8vh,80px) 16px 16px}
.ov.on{display:block}
.ovbox{max-width:760px;margin:0 auto;background:var(--bg);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - min(8vh,80px) - 24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.ovtop{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ovtop input{all:unset;flex:1;font-size:18px;min-height:48px}
.ovtop button{border:0;background:var(--surface2);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px}
.ovres{overflow-y:auto;padding:8px 16px 18px}
.grp{margin-top:14px}
.grp>small{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:6px 0}
.grp>small svg{color:var(--pink);width:16px;height:16px}
.hit{display:block;text-decoration:none;padding:10px 12px;border-radius:12px}
.hit:hover,.hit:focus{background:var(--surface)}
.hit em{font-style:normal;font-size:12.5px;color:var(--pinkInk);font-weight:500}
.hit p{font-size:14.5px;color:var(--muted);margin-top:2px}
.hint{color:var(--meta);font-size:14.5px;padding:18px 4px}
.hint button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;margin:4px 4px 0 0;font-size:13.5px}
mark{background:var(--blush);color:inherit;border-radius:3px;padding:0 2px}

/* contact */
.contact{background:var(--surface2);padding:clamp(44px,5vw,72px) 0}
.contact .box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--surface);border-radius:24px;padding:clamp(24px,3.5vw,40px)}
.contact h2{font-size:clamp(24px,2.8vw,34px)}
.contact .lede{margin-top:10px;font-size:17px}
.person{display:flex;gap:16px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.avatar img{width:38px;height:auto;opacity:.95}
.person b{display:block;font-size:19px}
.person a{color:var(--pinkInk);font-weight:700;text-decoration:none;font-size:17px}
.cbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cbtn{display:inline-flex;gap:8px;align-items:center;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.cbtn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
@media(max-width:900px){.contact .box{grid-template-columns:minmax(0,1fr)}}
footer{background:var(--navy);color:var(--on2);font-size:14.5px;position:relative;overflow:hidden}
footer .wrap::after{content:"";position:absolute;right:max(4vw,18px);top:22px;width:64px;height:67px;background:url(cat.png) no-repeat center/contain;opacity:.16;pointer-events:none}
@media(max-width:700px){footer .wrap::after{display:none}}
footer .wrap{position:relative;z-index:1}
footer .wrap{padding-top:32px;padding-bottom:32px}
footer details summary{cursor:pointer;color:#fff;font-weight:700;min-height:44px;display:flex;align-items:center}
footer .msteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:14px 0 18px}
footer .msteps b{color:#fff;display:block;margin-bottom:4px}
footer .bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--navy3);padding-top:18px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}.toast.on{opacity:1}

@media(max-width:1000px){.tnav{display:none}.qs{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.q::after{display:none}}
@media(max-width:900px){
 .hero .wrap,.thero .wrap{grid-template-columns:minmax(0,1fr)}
 .thero .art{max-width:420px}
 .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .two{grid-template-columns:minmax(0,1fr)}.mid{padding:12px 0;grid-auto-flow:column}.mid .dot{transform:rotate(90deg)}
 .keyline,.qgrid{grid-template-columns:minmax(0,1fr)}
 .stepper .wrap{display:flex;overflow-x:auto}.stepper a{flex:none;padding-right:14px}
 .switch .row6{grid-template-columns:repeat(3,minmax(0,1fr))}
 .row{grid-template-columns:44px minmax(0,1fr)}.row .what{grid-column:2}
 .risk{grid-template-columns:40px minmax(0,1fr)}.risk .do{grid-column:2}
 footer .msteps{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){.tgrid,.qs{grid-template-columns:minmax(0,1fr)}.switch .row6{grid-template-columns:repeat(2,minmax(0,1fr))}.stepper a span em{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="#home" aria-label="Overview"><img src="logo-white.png" alt="FatCat9"></a>
  <nav class="tnav" id="tnav" aria-label="Territories"></nav>
  <button class="sbtn" id="openSearch"><span>Search</span></button>
</div></header>
<main id="main"></main>
<footer id="foot"></footer>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Search"><div class="ovbox">
  <div class="ovtop"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search actions, audiences, risks…" aria-label="Search"><button id="closeSearch">Close</button></div>
  <div class="ovres" id="ovres"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
{
const ICON={

const ib=(n,c='')=>`<span class="ib ${c}">${ic(n)}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.toLowerCase().replace(/(^|[\s(/+&“–-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(And|Of|The|To|For|In|A|Or|Not|With|By)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase()).replace(/\bAi\b/g,'AI').replace(/\bMsps\b/g,'MSPs').replace(/\bEia\b/g,'EIA').replace(/\bUk\b/g,'UK').replace(/Q&a/gi,'Q&A');
const $=id=>document.getElementById(id);
const STEPS=[['shift','Strategic shift','What needs to change?','compass'],['actions','Possible actions','What can Eneus do?','target'],['stakeholders','Stakeholders','Who needs what?','users'],['watchouts','Watchouts','What should be avoided?','alert'],['activation','Activation','How will progress show?','flag']];

let D,T,IDX=[];

/* ---------- territory scenes (drawn) ---------- */
const P='#F43098',N2='#1F3050',N3='#2A3E63',W='#F5F5F7';

     <rect x="190" y="90" width="150" height="80" rx="18" fill="${P}"/><path d="M310 170 l12 26 -34 -26z" fill="${P}"/>
     ${[0,1,2].map(i=>`<g transform="translate(210 ${106+i*18})"><circle cx="5" cy="4" r="5" fill="#fff"/><path d="M2.5 4 l2 2 4-4" stroke="${P}" stroke-width="1.6" fill="none"/><rect x="16" y="0" width="${90-i*20}" height="8" rx="4" fill="#fff" fill-opacity=".9"/></g>`).join('')}`,

/* ---------- overview ---------- */
function ringMap(){
  const cx=280,cy=250,R=180,nodes=T.map((t,i)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  return `<svg class="map" viewBox="0 0 560 500" role="img" aria-label="Map of the six territories around the common direction">
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${N3}" stroke-width="1"/>
   ${nodes.map((n,i)=>`<line id="ln${i}" x1="${cx}" y1="${cy}" x2="${n[0]}" y2="${n[1]}"/>`).join('')}
   <circle cx="${cx}" cy="${cy}" r="82" fill="${N2}"/><circle cx="${cx}" cy="${cy}" r="82" fill="none" stroke="${P}" stroke-width="2"/>
   <text x="${cx}" y="${cy-18}" text-anchor="middle" fill="${P}" style="font:500 12px 'Google Sans Flex',sans-serif">Common direction</text>
   <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="${W}" style="font:700 16px 'Google Sans Flex',sans-serif">One current</text>
   <text x="${cx}" y="${cy+24}" text-anchor="middle" fill="${W}" style="font:700 16px 'Google Sans Flex',sans-serif">project record</text>
   ${nodes.map((n,i)=>{const lab=SHORT[i],below=n[1]>cy+20,ty=below?n[1]+58:n[1]-46;return `<g class="node" tabindex="0" role="link" data-i="${i}" aria-label="Territory ${i+1}: ${esc(cap(T[i].name))}">
     <circle class="b" cx="${n[0]}" cy="${n[1]}" r="32"/><g transform="translate(${n[0]-11} ${n[1]-17}) scale(.92)" style="color:#fff">${ic(T[i].icon).replace('class="i"','width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"')}</g>
     <text class="num" x="${n[0]}" y="${n[1]+20}" text-anchor="middle">${i+1}</text>
     <text x="${n[0]}" y="${ty}" text-anchor="middle">${esc(lab)}</text></g>`}).join('')}
  </svg>`;
}
function home(){
  const e=D.exec;
  return `<section class="hero"><div class="wrap">
   <div><p class="eyebrow">Hunterston Data Centre · Strategic communication recommendations</p>
    <h1>Six territories.<br><span class="pk">One communication direction.</span></h1>
    <p class="lede">${esc(D.cover.sub.replace('six priorities','six territories'))}</p>
    <p class="lede" style="margin-top:12px;font-size:16px">Each territory defines the most important communication shift required to make the project easier to evaluate.</p>
    <div class="cta"><a class="btn pink" href="#t1">Start with Territory 1 ${ic('arrow')}</a><button class="btn ghost" data-search>${ic('search')} Search</button></div></div>
   <div class="mapbox">${ringMap()}<div class="peek" id="peek"><small>Common direction · hover or tap a territory</small><b style="font-size:16px;font-weight:500">${esc(e.common[1])}</b></div></div>
  </div></section>
  <section class="legend"><div class="wrap">
   <p class="eyebrow">How to read a territory</p><h2>Every territory answers <span class="pk">the same five questions.</span></h2>
   <div class="qs">${STEPS.map((s,i)=>`<div class="q"><span class="n">Step ${i+1}</span><div class="ic">${ic(s[3])}</div><b>${s[2]}</b><span>${s[1]}</span></div>`).join('')}</div>
  </div></section>
  <section class="tlist"><div class="wrap">
   <p class="eyebrow">The six territories</p><h2>Choose a territory <span class="pk">to start.</span></h2>
   <div class="tgrid">${e.cols.map((c,i)=>`<a class="tcard" href="#t${i+1}"><div class="art">${scene(i)}</div><div class="body"><small>Territory ${i+1} · ${esc(cap(c[0]))}</small><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><span class="go">Explore ${ic('arrow')}</span></div></a>`).join('')}</div>
  </div></section>${contact()}`;
}
function bindMap(){
  const e=D.exec,pk=$('peek');if(!pk)return;
  document.querySelectorAll('.map .node').forEach(g=>{
    const i=+g.dataset.i,show=()=>{document.querySelectorAll('.map .node').forEach(x=>x.classList.toggle('on',x===g));document.querySelectorAll('.map line').forEach((l,k)=>l.classList.toggle('on',k===i));
      pk.innerHTML=`<small>Territory ${i+1} · ${esc(cap(T[i].name))}</small><b>${esc(e.cols[i][1])}</b><span>${esc(e.cols[i][2])}</span>`};
    g.addEventListener('mouseenter',show);g.addEventListener('focus',show);
    g.addEventListener('click',()=>location.hash='t'+(i+1));g.addEventListener('keydown',ev=>{if(ev.key==='Enter')location.hash='t'+(i+1)});
  });
}

/* ---------- territory ---------- */
function evidence(o){
  const parts=o.evidence.map(e=>`<a href="${esc(e[1])}" target="_blank" rel="noopener">${esc(e[0])}</a>`);
  if(o.diag)parts.push('Diagnostic pp. '+o.diag.map(d=>`<a href="${esc(d[1])}" target="_blank" rel="noopener">${esc(d[0])}</a>`).join(o.diag.length>2?', ':' & '));
  if(o.extra)parts.push(`<a href="${esc(o.extra[1])}" target="_blank" rel="noopener">${esc(o.extra[0])}</a>`);
  return parts.join(' · ');
}
function stage(t,s,n){
  const st=STEPS.find(x=>x[0]===s),Hd=o=>`<div class="qhead">${ib(st[3],'solid')}Step ${STEPS.indexOf(st)+1} · ${st[2]}</div><h2>${esc(o.title)}</h2><p class="lede">${esc(o.sub)}</p>`;
  if(s==='shift'){const o=t.shift;return Hd(o)+`<div class="two"><div class="pane"><div class="plab">${ib('eye')}What the conversation established</div><p class="plead">${esc(o.estLead)}</p><ul class="b">${o.est.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="mid"><span>Points to</span><span class="dot">${ic('arrow')}</span></div>
   <div class="pane dark"><div class="plab">${ib('compass','solid')}Recommended shift</div><p class="plead">${esc(o.shiftLead)}</p><ul class="b">${o.shifts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
   <div class="keyline"><div class="pane">${ib('bulb')}<div><div class="plab" style="margin:0">Key consideration</div><p class="k">${esc(o.key)}</p></div></div>
   <div class="pane">${ib('link')}<div><div class="plab" style="margin:0">Evidence</div><p class="ev">${evidence(o)}</p></div></div></div>`;}
  if(s==='actions'){const o=t.actions;return Hd(o)+`<div class="rule">${ib('shield','solid')}<div><small>Operating rule</small><p>${esc(o.rule)}</p></div></div>
   <div class="list">${o.rows.map((r,i)=>`<div class="row"><span class="n">${i+1}</span><div><h3>${esc(cap(r[0]))}</h3><p class="why">${esc(r[1])}</p></div><p class="what"><small>Recommended direction</small>${esc(r[2])}</p></div>`).join('')}</div>`;}
  if(s==='stakeholders'){const o=t.stake;return Hd(o)+`<div class="rule soft">${ib('check')}<div><small>${esc(cap(o.stdLabel))}</small><p><b>${esc(o.std)}</b></p></div></div>
   <div class="list">${o.rows.map((r,i)=>`<div class="row"><span class="n">${i+1}</span><div><h3>${esc(cap(r[0]))}</h3><span class="role">${esc(cap(r[1]))}</span></div><p class="what"><small>What they need to use or share</small>${esc(r[2])}</p></div>`).join('')}</div>
   <div class="rule" style="margin-top:22px">${ib('bulb','solid')}<div><small>${esc(cap(o.bar[0]))}</small><p>${esc(o.bar[1])}</p></div></div>`;}
  if(s==='watchouts'){const o=t.watch;return Hd(o)+`<div class="risks">${o.risks.map(r=>`<div class="risk"><span class="ri">${ic('alert')}</span><div><h3>${esc(cap(r[0]))}</h3><p class="if">${esc(r[1])}</p></div><p class="do">${ic('check')}<span>${esc(r[2])}</span></p></div>`).join('')}</div>
   <div class="rule" style="margin-top:22px">${ib('bulb','solid')}<div><small>Strategic implication</small><p><b>${esc(o.implication)}</b></p></div></div>`;}
  if(s==='activation'){const o=t.act;return Hd(o)+`<div class="two"><div class="pane"><div class="plab">${ib('route')}Activation sequence · What happens when</div><ol class="seq">${o.seq.map((q,i)=>`<li><span class="c">${i+1}</span><div><b>${esc(q[0])}</b><span>${esc(q[1])}</span></div></li>`).join('')}</ol></div>
   <div class="mid"><span>Defines</span><span class="dot">${ic('arrow')}</span></div>
   <div class="pane dark"><div class="plab">${ib('flag','solid')}Progress conditions · What success should look like</div><ul class="checks">${o.prog.map(x=>`<li>${ic('check')}<span>${esc(x)}</span></li>`).join('')}</ul></div></div>
   <div class="rule soft" style="margin-top:16px">${ib('book')}<div><p><b>${esc(o.footer)}</b></p></div></div>`;}
}
function territory(n,s){
  const t=T[n-1],o=t.opener,e=D.exec.cols[n-1],si=s?STEPS.findIndex(x=>x[0]===s):-1,cur=s||'shift',ci=STEPS.findIndex(x=>x[0]===cur);
  const nx=ci<4?{h:`#t${n}-${STEPS[ci+1][0]}`,s:`Next step · ${STEPS[ci+1][2]}`,b:STEPS[ci+1][1]}:n<6?{h:`#t${n+1}`,s:'Next territory',b:`${n+1} · ${cap(T[n].name)}`}:{h:'#home',s:'Finished',b:'Back to the overview'};
  const pv=ci>0?{h:`#t${n}-${STEPS[ci-1][0]}`,s:'Previous step',b:STEPS[ci-1][1]}:n>1?{h:`#t${n-1}`,s:'Previous territory',b:`${n-1} · ${cap(T[n-2].name)}`}:{h:'#home',s:'Back',b:'Overview'};
  return `<section class="thero"><div class="wrap">
    <div class="crumbs"><a href="#home">Overview</a> / <span>Territory ${n} of 6</span></div>
    <div><p class="eyebrow">${ib(t.icon,'solid')}Territory ${n} of 6 · ${esc(cap(t.name))}</p><h1>${esc(o.title)}</h1><p class="lede">${esc(o.sub)}</p>
     <p class="sig">${esc(cap(o.signalsLabel))}</p><div class="stats">${o.stats.map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${esc(cap(x[0]))}</span></div>`).join('')}</div></div>
    <div class="art">${scene(n-1)}</div>
  </div></section>
  <section class="quick"><div class="wrap"><p class="eyebrow">In 30 seconds</p>
   <div class="qgrid"><div><small>What the conversation shows</small><b>${esc(t.shift.estLead)}</b></div>
   <div><small>The shift we recommend</small><b>${esc(e[1])}</b><span>${esc(e[2])}</span></div>
   <div><small>Keep in mind</small><b>${esc(t.shift.key)}</b></div></div></div></section>
  <nav class="stepper" aria-label="Steps"><div class="wrap">${STEPS.map((x,i)=>`<a href="#t${n}-${x[0]}"${i===ci?' aria-current="step"':''} class="${i<ci?'done':''}"><span class="c">${i+1}</span><span>${x[1]}<em>${x[2]}</em></span></a>`).join('')}</div></nav>
  <section class="stage" id="stage"><div class="wrap">${stage(t,cur,n)}
   <div class="next"><a href="${pv.h}"><small>← ${pv.s}</small><b>${esc(pv.b)}</b></a><a class="fwd" href="${nx.h}"><small>${nx.s} →</small><b>${esc(nx.b)}</b></a></div>
  </div></section>
  <section class="switch"><div class="wrap"><p class="eyebrow" style="margin:0">Jump to another territory</p>
   <div class="row6">${T.map((x,i)=>`<a href="#t${i+1}"${i===n-1?' aria-current="page"':''}>${ib(x.icon)}<span><small>Territory ${i+1}</small><br>${esc(SHORT[i])}</span></a>`).join('')}</div></div></section>${contact()}`;
}

/* ---------- search ---------- */
function buildIndex(){
  T.forEach((t,i)=>{const n=i+1,a=(s,l,txt)=>IDX.push({n,h:`#t${n}-${s}`,l,txt});
    a('shift','Strategic shift',[t.shift.title,t.shift.estLead,...t.shift.est,t.shift.shiftLead,...t.shift.shifts,t.shift.key].join(' '));
    a('actions','Operating rule',t.actions.rule);
    t.actions.rows.forEach(r=>a('actions','Action · '+cap(r[0]),r[1]+' '+r[2]));
    t.stake.rows.forEach(r=>a('stakeholders','Audience · '+cap(r[0]),cap(r[1])+' — '+r[2]));
    t.watch.risks.forEach(r=>a('watchouts','Watchout · '+cap(r[0]),r[1]+' → '+r[2]));
    t.act.seq.forEach(q=>a('activation','Activation · '+q[0],q[1]));
    a('activation','Progress conditions',t.act.prog.join(' · '));
  });
}
function runSearch(q){
  const box=$('ovres');const w=q.toLowerCase().split(/\s+/).filter(x=>x.length>1);
  if(!w.length){box.innerHTML=`<div class="hint">Type a word to find it in any territory. Try: ${['consultation','suppliers','planning','media','flooding','evidence'].map(x=>`<button data-try="${x}">${x}</button>`).join('')}</div>`;return}
  const hits=IDX.filter(e=>w.every(x=>(e.l+' '+e.txt).toLowerCase().includes(x)));
  const mk=s=>{let h=esc(s);w.forEach(x=>{h=h.replace(new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return h};
  const snip=s=>{const k=s.toLowerCase().indexOf(w[0]);const a=Math.max(0,k-70);return (a?'…':'')+s.slice(a,a+190)+(s.length>a+190?'…':'')};
  if(!hits.length){box.innerHTML=`<div class="hint">Nothing found for “${esc(q)}”. Try a shorter word.</div>`;return}
  box.innerHTML=T.map((t,i)=>{const hs=hits.filter(h=>h.n===i+1);if(!hs.length)return'';return `<div class="grp"><small>${ic(t.icon)}Territory ${i+1} · ${esc(cap(t.name))} <span style="color:var(--meta);font-weight:400">(${hs.length})</span></small>${hs.map(h=>`<a class="hit" href="${h.h}"><em>${mk(h.l)}</em><p>${mk(snip(h.txt))}</p></a>`).join('')}</div>`}).join('');
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800)}
function openSearch(){$('ov').classList.add('on');$('q').focus();runSearch($('q').value)}
function closeSearch(){$('ov').classList.remove('on')}

function contact(){
  return `<section class="contact" id="contact"><div class="wrap"><div class="box">
   <div><p class="eyebrow">Contact</p><h2>Questions about <span class="pk">the recommendations?</span></h2>
    <p class="lede">Get in touch with FatCat9 for context on any territory, or to discuss how these recommendations translate into the playbook.</p></div>
   <div><div class="person"><span class="avatar"><img src="cat.png" alt=""></span><div><b>Carlos</b><span style="color:var(--muted);font-size:15px">FatCat9</span><br><a href="mailto:${EMAIL}">${EMAIL}</a></div></div>
    <div class="cbtns"><a class="cbtn pink" href="mailto:${EMAIL}">${ic('arrow')} Email Carlos</a><button class="cbtn" data-copymail>Copy email</button></div></div>
  </div></div></section>`;
}
/* ---------- shell ---------- */
function nav(cur){
  $('tnav').innerHTML=`<a href="#home"${cur===0?' aria-current="page"':''}>Overview</a>`+T.map((t,i)=>`<a href="#t${i+1}"${cur===i+1?' aria-current="page"':''} title="Territory ${i+1} · ${esc(cap(t.name))}" aria-label="Territory ${i+1} · ${esc(cap(t.name))}">${ic(t.icon)}${i+1}${cur===i+1?' · '+esc(SHORT[i]):''}</a>`).join('');
}
function foot(){
  const m=D.method;
  $('foot').innerHTML=`<div class="wrap"><details><summary>About this tool · How the recommendations were developed</summary>
   <p style="max-width:70ch">${esc(m.sub)}</p>
   <div class="msteps">${m.steps.map((s,i)=>`<div><b>${i+1}. ${esc(cap(s[0]))}</b>${esc(s[1])}</div>`).join('')}</div>
   <p style="font-size:13.5px">${esc(D.priorities.note)}</p></details>
   <div class="bot"><span>Hunterston Data Centre · Strategic Communication Recommendations</span><span>Prepared for Eneus Energy by FatCat9 · Carlos · <a href="mailto:${EMAIL}" style="color:#fff">${EMAIL}</a></span></div></div>`;
}
function route(){
  closeSearch();
  const h=(location.hash||'#home').slice(1);let m;
  if(m=h.match(/^t([1-6])(?:-(shift|actions|stakeholders|watchouts|activation))?$/)){
    nav(+m[1]);$('main').innerHTML=territory(+m[1],m[2]);
    {const a=document.querySelector('.stepper a[aria-current]');a&&a.scrollIntoView({block:'nearest',inline:'center'})}
    if(m[2]){const y=$('stage').getBoundingClientRect().top+scrollY-68-72;window.scrollTo({top:y,behavior:'instant'})}else window.scrollTo({top:0,behavior:'instant'});
  }else{nav(0);$('main').innerHTML=home();bindMap();window.scrollTo({top:0,behavior:'instant'})}
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-search],#openSearch')){openSearch();return}
  if(e.target.closest('#closeSearch')||e.target===$('ov')){closeSearch();return}
  if(e.target.closest('[data-copymail]')){try{navigator.clipboard.writeText(EMAIL).then(()=>toast('Email copied'),()=>toast(EMAIL))}catch(_){toast(EMAIL)}return}
  const t=e.target.closest('[data-try]');if(t){$('q').value=t.dataset.try;runSearch(t.dataset.try);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='/'&&!$('ov').classList.contains('on')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openSearch()}});
$('q').addEventListener('input',e=>runSearch(e.target.value));
$('openSearch').innerHTML=ic('search')+'<span>Search</span>';
window.addEventListener('hashchange',route);
fetch('data.json').then(r=>r.json()).then(d=>{D=d;T=d.territories;buildIndex();foot();route()}).catch(()=>{$('main').innerHTML='<div class="wrap" style="padding:60px 0"><p class="lede">The content could not load. Reload the page.</p></div>'});
}
</script>
