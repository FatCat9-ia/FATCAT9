<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  :root { --black:#0d0d0d; --off-black:#141414; --border:#272727; --gray-mid:#777; --chalk:#ebebeb; --red:#d92b2b; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--black); color:var(--chalk); font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px)); padding-top:max(12px, env(safe-area-inset-top,0px)); border-bottom:1px solid var(--border); background:var(--off-black); }
  header img { width:30px; height:30px; border-radius:4px; }
  header .t { font-size:13px; font-weight:600; }
  header .s { font-size:11px; color:var(--gray-mid); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-height:0; }
  .frame { width:100%; max-width:calc((100vh - 140px) * 16 / 9); aspect-ratio:16/9; max-height:100%; }
  .frame iframe { width:100%; height:100%; border:0; border-radius:6px; background:#000; }
  footer { padding:10px 24px; padding-bottom:max(10px, env(safe-area-inset-bottom,0px)); border-top:1px solid var(--border); font-size:11px; color:var(--gray-mid); text-align:center; }
  footer a { color:var(--red); text-decoration:none; }
  @media (max-width:640px) { main { padding:12px; } header { padding-left:16px; padding-right:16px; } }
</style>
